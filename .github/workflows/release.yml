# Publishes to the VS Code Marketplace when a version tag is pushed.
# Uses Marketplace Trusted Publishing (OIDC): no long-lived token is stored in the repository.
# Prerequisites (one-time, see docs/RELEASING.md): publisher created, Trusted Publishing configured
# for this repository/workflow, and a protected "marketplace" environment with required reviewers.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Determine channel (odd minor = pre-release)
        id: channel
        run: |
          minor=$(node -p "require('./package.json').version.split('.')[1]")
          if [ $((minor % 2)) -eq 1 ]; then echo "flag=--pre-release" >> "$GITHUB_OUTPUT"; else echo "flag=" >> "$GITHUB_OUTPUT"; fi
      - run: npx vsce package --no-dependencies ${{ steps.channel.outputs.flag }} -o sovran.vsix
      - run: npm run verify:vsix -- sovran.vsix
      - name: Installed VSIX smoke in a fresh profile
        run: xvfb-run -a npm run test:extension
        env:
          SOVRAN_TEST_VSIX: sovran.vsix
      # The pre-release marker is already baked into the VSIX at package time.
      - run: npx vsce publish --packagePath sovran.vsix --oidc
      - uses: softprops/action-gh-release@v2
        with:
          files: sovran.vsix
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.flag != '' }}
