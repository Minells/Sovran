# Builds, verifies and releases the extension when a version tag (vX.Y.Z) is pushed.
#
#   build           tests the tagged commit, packages sovran-X.Y.Z.vsix, checks its contents, installs it in a fresh
#                   VS Code profile and writes the release notes. Read-only access to the repository.
#   github-release  publishes a GitHub Release with the VSIX and its SHA-256. The only job that can write to the repo.
#   marketplace     publishes the same VSIX to the VS Code Marketplace with Trusted Publishing (OIDC). It runs only
#                   when the repository variable MARKETPLACE_PUBLISH is 'true' and waits for the reviewers of the
#                   protected "marketplace" environment. One-time setup: docs/RELEASING.md.
#
# A GitHub Release therefore never depends on the Marketplace being configured.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify VSIX
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vsix: ${{ steps.meta.outputs.vsix }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read version and channel (odd minor = pre-release)
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          minor=$(echo "${version}" | cut -d. -f2)
          if [ $((minor % 2)) -eq 1 ]; then prerelease=true; else prerelease=false; fi
          {
            echo "version=${version}"
            echo "vsix=sovran-${version}.vsix"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
      - run: npm run check
      # vsce runs vscode:prepublish (npm run build) before packaging.
      - name: Package VSIX
        run: npx vsce package --no-dependencies ${{ steps.meta.outputs.prerelease == 'true' && '--pre-release' || '' }} -o "${{ steps.meta.outputs.vsix }}"
      - run: npm run verify:vsix -- "${{ steps.meta.outputs.vsix }}"
      - name: Installed VSIX smoke in a fresh profile
        run: xvfb-run -a npm run test:extension
        env:
          SOVRAN_TEST_VSIX: ${{ steps.meta.outputs.vsix }}
      - name: Checksum and release notes
        run: |
          sha256sum "${{ steps.meta.outputs.vsix }}" > "${{ steps.meta.outputs.vsix }}.sha256"
          node scripts/release-notes.mjs "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.vsix }}" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ steps.meta.outputs.vsix }}
            ${{ steps.meta.outputs.vsix }}.sha256
            release-notes.md
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Sovran v${{ needs.build.outputs.version }}
          body_path: release-notes.md
          # Appends the list of merged pull requests and new contributors after the notes above.
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            ${{ needs.build.outputs.vsix }}
            ${{ needs.build.outputs.vsix }}.sha256

  marketplace:
    name: VS Code Marketplace
    needs: [build, github-release]
    if: vars.MARKETPLACE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Installs the locked vsce; nothing is built here.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - run: sha256sum -c "${{ needs.build.outputs.vsix }}.sha256"
      # Publishes the exact file attached to the GitHub Release. The pre-release marker is baked in at package time.
      - run: npx vsce publish --packagePath "${{ needs.build.outputs.vsix }}" --oidc
