name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Dependency install scripts are not needed (see docs/DEVELOPMENT.md) and npm 12 blocks them by default:
      # CI installs the same way, so it checks what developers get.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Extension smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Extension smoke tests
        if: runner.os != 'Linux'
        run: npm run test:extension

  package:
    name: Package VSIX
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Dependency install scripts are not needed (see docs/DEVELOPMENT.md) and npm 12 blocks them by default:
      # CI installs the same way, so it checks what developers get.
      - run: npm ci --ignore-scripts
      - run: npx vsce package --no-dependencies --pre-release -o sovran.vsix
      - run: npx vsce ls --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: sovran-vsix
          path: sovran.vsix
