name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Dependency install scripts are not needed (see docs/DEVELOPMENT.md) and npm 12 blocks them by default:
      # CI installs the same way, so it checks what developers get.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Extension smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Extension smoke tests
        if: runner.os != 'Linux'
        run: npm run test:extension
      - name: Minimum VS Code smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
        env:
          SOVRAN_TEST_VSCODE_VERSION: '1.95.0'
      - name: Minimum VS Code smoke
        if: runner.os != 'Linux'
        run: npm run test:extension
        env:
          SOVRAN_TEST_VSCODE_VERSION: '1.95.0'

  package:
    name: Package VSIX
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Dependency install scripts are not needed (see docs/DEVELOPMENT.md) and npm 12 blocks them by default:
      # CI installs the same way, so it checks what developers get.
      - run: npm ci --ignore-scripts
      - run: npx vsce package --no-dependencies --pre-release -o sovran.vsix
      - run: npx vsce ls --no-dependencies
      - run: npm run verify:vsix -- sovran.vsix
      - name: Installed VSIX smoke in a fresh profile
        run: xvfb-run -a npm run test:extension
        env:
          SOVRAN_TEST_VSIX: sovran.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sovran-vsix
          path: sovran.vsix
